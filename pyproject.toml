[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasdoc"
version = "1.2.0"
description = "Local vision-model PDF to Markdown converter"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Selçuk Metcan" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "PyMuPDF>=1.24.13",
    "openai>=1.54.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
atlasdoc = "atlasdoc.cli:main"

[project.urls]
Homepage = "https://github.com/smetcan/AtlasDoc"

[tool.setuptools]
py-modules = ["app", "converter"]
packages = ["atlasdoc"]
include-package-data = true

[tool.setuptools.package-data]
atlasdoc = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
